services:
  api:
    build: ./backend
    environment:
      ASPNETCORE_URLS: http://+:5080
      ConnectionStrings__Telemetry: Data Source=/data/telemetry.db
      Telemetry__ApiKey: ${TELEMETRY_API_KEY:?Set TELEMETRY_API_KEY before starting Compose}
      Benchmarks__WorkerEnabled: "false"
    ports: ["127.0.0.1:5080:5080"]
    volumes: ["telemetry-data:/data", "./benchmarks:/app/benchmarks:ro"]
  dashboard:
    build: ./dashboard
    environment:
      TELEMETRY_API_KEY: ${TELEMETRY_API_KEY:?Set TELEMETRY_API_KEY before starting Compose}
    ports: ["127.0.0.1:5173:80"]
    depends_on: [api]
volumes:
  telemetry-data:
