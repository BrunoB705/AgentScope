# Plantilla: el Dockerfile la copia como /etc/nginx/templates/default.conf.template y
# el entrypoint oficial de nginx sustituye ${TELEMETRY_API_KEY}. El proxy inyecta la
# cabecera para que la clave no llegue al navegador.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:5080/api/;
    proxy_set_header X-Telemetry-Key "${TELEMETRY_API_KEY}";
  }

  location /hubs/ {
    proxy_pass http://api:5080/hubs/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Telemetry-Key "${TELEMETRY_API_KEY}";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
